secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#BE123C"
borderColor = "#E2E8F0"
codeTextColor = "#334155"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
redColor = "#E11D48"
orangeColor = "#EA580C"
yellowColor = "#CA8A04"
greenColor = "#059669"
blueColor = "#0284C7"
violetColor = "#7C3AED"
grayColor = "#64748B"

[theme.dark]
primaryColor = "#E11D48"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#151E2E"
codeBackgroundColor = "#1A2436"
textColor = "#F1F5F9"
linkColor = "#FB7185"
borderColor = "#2A3548"
codeTextColor = "#CBD5E1"
dataframeBorderColor = "#2A3548"
dataframeHeaderBackgroundColor = "#151E2E"
redColor = "#F43F5E"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
